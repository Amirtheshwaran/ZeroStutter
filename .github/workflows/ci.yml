name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Validate-Project.ps1

      - name: Validate in PowerShell 7
        shell: pwsh
        run: .\tests\Validate-Project.ps1
