name: Report a bug
description: Report a failed command, incorrect behavior, or restoration problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Include the smallest steps that reproduce the problem. Use the performance report form for measured improvements, regressions, or unchanged frame pacing.
        Review attachments for user names, local paths, and other personal information. Keep recovery journals locally until recovery finishes; do not delete them to hide an error.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Version and environment
      description: Include ZeroStutter release or commit, Windows build, PowerShell version, CPU/GPU, and game/version if relevant. Include PresentMon version for capture problems.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and exact command
      description: Include session options, how the game was selected, and whether the problem happens every time.
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Errors and relevant logs
      description: Paste the full error text or attach a reviewed session report. For capture failures, include the CSV's .presentmon.log sidecar. Describe any removed personal information.
      render: text
  - type: textarea
    id: recovery
    attributes:
      label: Restoration status
      description: For tuning problems, did Stop and restore in the desktop app, Q in the console, target exit, or -Recover restore the settings? Include the cleanup message and whether a ZeroStutter temporary power plan remains. Enter not applicable for read-only problems.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mention other tuning tools, organization policy, or game protection/access-denied messages if relevant. Do not disable protections to reproduce an issue.
